# ============================================================
#  Production — PostgreSQL (Render.com)
#  Render sets DATABASE_URL automatically.
#  Do not set SPRING_PROFILES_ACTIVE=prod on Railway.
#  Railway uses application.properties with the MySQL plugin.
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
#  Server — Render sets PORT automatically
# ============================================================
server.port=${PORT:8080}
